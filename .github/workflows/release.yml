name: Release desktop app

# Builds Mozhi for Windows and macOS (Apple Silicon) and attaches the installers to a
# GitHub release. Push a tag like v0.1.0-beta.1 to run it, or start it by hand from the
# Actions tab with an existing tag.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and attach to (e.g. v0.1.0-beta.1)"
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows (x64)
            os: windows-latest
            args: ""
            # Portable CPU baseline: never compile whisper.cpp for the CI machine's own CPU.
            ggml: "AVX2"
          - name: macOS (Apple Silicon)
            os: macos-latest
            args: "--target aarch64-apple-darwin"
            ggml: "ARM"
    runs-on: ${{ matrix.os }}
    env:
      GGML_NATIVE: "OFF"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: CPU baseline for whisper.cpp (x64)
        if: matrix.ggml == 'AVX2'
        shell: bash
        run: |
          {
            echo "GGML_AVX=ON"
            echo "GGML_AVX2=ON"
            echo "GGML_FMA=ON"
            echo "GGML_F16C=ON"
            echo "GGML_AVX512=OFF"
          } >> "$GITHUB_ENV"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
          key: ${{ matrix.ggml }}

      - name: Install JavaScript dependencies
        run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          tauriScript: npm run tauri
          args: ${{ matrix.args }}
          tagName: ${{ inputs.tag || github.ref_name }}
          releaseName: "Mozhi ${{ inputs.tag || github.ref_name }}"
          releaseDraft: false
          # v1.2.3 is a full release (served by /releases/latest); v1.2.3-beta.1 is a pre-release.
          prerelease: ${{ contains(inputs.tag || github.ref_name, '-') }}
          releaseBody: |
            ## Mozhi · மொழி beta

            Open-source, on-device Tamil voice typing. Double-tap Control, speak Tamil, Tanglish or English, and the text lands in the app you're in.

            **This is an unsigned beta for testing.**

            ### macOS (Apple Silicon, macOS 12+)
            1. Download the `.dmg`, open it and drag **Mozhi** to Applications.
            2. The first time, right-click Mozhi in Applications and choose **Open**, then **Open** again. (It isn't notarised by Apple yet.) If macOS still refuses, open System Settings → Privacy & Security and click **Open Anyway**.
            3. Allow **Microphone** and **Accessibility** when asked. Accessibility is what lets Mozhi hear the double-tap and paste for you.

            ### Windows (10/11, 64-bit)
            1. Download the `-setup.exe` (or the `.msi`) and run it.
            2. SmartScreen may warn that the app is unrecognised: click **More info** → **Run anyway**. (It isn't code-signed yet.)

            ### First run
            Mozhi downloads a speech model the first time (about 265 MB for the recommended Tamil model). After that everything runs offline.

            Found a problem? [Report it here](https://github.com/justkamal07/mozhi/issues/new/choose).

  # Stable file names so the website can link straight to the newest installer:
  #   https://github.com/justkamal07/mozhi/releases/latest/download/Mozhi-macOS-AppleSilicon.dmg
  #   https://github.com/justkamal07/mozhi/releases/latest/download/Mozhi-Windows-x64-setup.exe
  # Also replaces the generic body with docs/releases/<tag>.md when that file exists.
  finalize:
    name: Stable download names and notes
    needs: build
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Attach stable-named copies
        run: |
          set -euo pipefail
          mkdir -p dl stable
          gh release download "$TAG" --dir dl --pattern '*.dmg' --pattern '*-setup.exe' --pattern '*.msi'
          cp dl/*_aarch64.dmg stable/Mozhi-macOS-AppleSilicon.dmg
          cp dl/*_x64-setup.exe stable/Mozhi-Windows-x64-setup.exe
          cp dl/*_x64_en-US.msi stable/Mozhi-Windows-x64.msi
          gh release upload "$TAG" stable/* --clobber
      - name: Release notes
        run: |
          if [ -f "docs/releases/$TAG.md" ]; then
            gh release edit "$TAG" --notes-file "docs/releases/$TAG.md"
          fi

